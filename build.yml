name: Build dezuClip (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: dezuClip-VST3-windows
          path: build/dezuClip_artefacts/Release/VST3/dezuClip.vst3

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: dezuClip-Standalone-windows
          path: build/dezuClip_artefacts/Release/Standalone/dezuClip.exe
